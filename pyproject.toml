[project]
name = "drp-climate-master"
version = "3.0.0.dev0"
description = "DRP Climate Master v3 - integrazione Home Assistant per impianto HVAC residenziale"
requires-python = ">=3.14"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["reference"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "ASYNC", "SIM", "C4", "RUF"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # docstring/commenti in italiano: accenti e simboli (°, ×) ammessi
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.pyright]
include = ["custom_components", "tests"]
exclude = ["reference", "**/__pycache__"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
